<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <!-- https://developer.mozilla.org/en-US/docs/Web/HTTP/CSP -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'"
    />
    <meta
      http-equiv="X-Content-Security-Policy"
      content="default-src 'self'; script-src 'self'"
    />
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
        <main class="main-container"> 
            <header class="input-container">
                <input class="city-input" placeholder="Search for a city..." />
                <button class="search-btn">
                    <span  class="search">
                        >
                    </span>
                </button>
            </header>

            <section class="weather-info" style="display: none;">
                <div class="location-date-container">
                    <div class="location">
                        <span class="loc">
                            v
                        </span>
                        <h4 class="country-txt">France</h4>
                    </div>
                    <h5 class="current-date-txt regular-txt">Mon, 09 Feb</h5>
                </div>

                <div class="weather-summary-container">
                    <img src="assets/sunny.gif" class="weather-summary-img">
                    <div class="weather-summary-info">
                        <h1 class="temp-txt">29 °C</h1>
                        <h3 class="condition-txt regular-txt">Sunny</h3>
                    </div>
                </div>

                <div class="weather-conditions-container">
                    <div class="condition-item">
                        <span class="water">
                            o
                        </span>
                        <div class="condition-info">
                            <h5 class="regular-txt">Humidity</h5>
                            <h5 class="humidity-value-txt">55%</h5>
                        </div>
                    </div>

                    <div class="condition-item">
                        <span class="wind">
                            =
                        </span>
                        <div class="condition-info">
                            <h5 class="regular-txt">Wind Speed</h5>
                            <h5 class="wind-value-txt">12 km/h</h5>
                        </div>
                    </div>
                </div>

                <div class="forecast-items-container">
                    <div class="forecast-item">
                        <h5 class="forecast-item-date regular-txt">10 Feb</h5>
                        <img src="assets/rainy.gif" class="forecast-item-img">
                        <h5 class="forecast-item-temp">29 °C</h5>
                    </div>
                    <div class="forecast-item">
                        <h5 class="forecast-item-date regular-txt">10 Feb</h5>
                        <img src="assets/rainy.gif" class="forecast-item-img">
                        <h5 class="forecast-item-temp">29 °C</h5>
                    </div>
                    <div class="forecast-item">
                        <h5 class="forecast-item-date regular-txt">10 Feb</h5>
                        <img src="assets/rainy.gif" class="forecast-item-img">
                        <h5 class="forecast-item-temp">29 °C</h5>
                    </div>
                    <div class="forecast-item">
                        <h5 class="forecast-item-date regular-txt">10 Feb</h5>
                        <img src="assets/rainy.gif" class="forecast-item-img">
                        <h5 class="forecast-item-temp">29 °C</h5>
                    </div>
                    <div class="forecast-item">
                        <h5 class="forecast-item-date regular-txt">10 Feb</h5>
                        <img src="assets/rainy.gif" class="forecast-item-img">
                        <h5 class="forecast-item-temp">29 °C</h5>
                    </div>
                    <div class="forecast-item">
                        <h5 class="forecast-item-date regular-txt">10 Feb</h5>
                        <img src="assets/rainy.gif" class="forecast-item-img">
                        <h5 class="forecast-item-temp">29 °C</h5>
                    </div>
                </div>

            </section>

            <section class="search-city section-message">
                <img src="assets/search-city.png" class="message-img">
                <div>
                    <h1>Search for a city</h1>
                    <h4 class="regular-txt">
                        Find out the weather conditions of the city
                    </h4>
                </div>
            </section>

        </main>

  </body>
</html>
